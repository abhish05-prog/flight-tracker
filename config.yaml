# Flight Price Tracker configuration

origin: YYZ
currency: cad

destinations:
  - code: LHR
    name: London
  - code: CDG
    name: Paris
  - code: FCO
    name: Rome
  - code: AMS
    name: Amsterdam
  - code: MAD
    name: Madrid
  - code: BCN
    name: Barcelona
  - code: FRA
    name: Frankfurt
  - code: MUC
    name: Munich
  - code: DUB
    name: Dublin
  - code: ZRH
    name: Zurich
  - code: VIE
    name: Vienna
  - code: LIS
    name: Lisbon
  - code: ATH
    name: Athens
  - code: CPH
    name: Copenhagen
  - code: ARN
    name: Stockholm
  - code: BER
    name: Berlin
  - code: WAW
    name: Warsaw
  - code: PRG
    name: Prague
  - code: BUD
    name: Budapest
  - code: BRU
    name: Brussels
  - code: MXP
    name: Milan
  - code: OSL
    name: Oslo
  - code: HEL
    name: Helsinki
  - code: EDI
    name: Edinburgh
  - code: KEF
    name: Reykjavik

  # Priority routes: shown in their own highlighted section on the history
  # page. No deal alerts/floor for these two -- just recorded daily and
  # color-coded (green/orange/red) on the history page based on how each
  # day's price compares to the route's own all-time average.
  #
  # Delhi is direct_only (nonstop-only, via /v1/prices/direct) since Air
  # India flies YYZ-DEL nonstop.
  #
  # Mumbai has no scheduled nonstop from YYZ, so it's tracked like the
  # European routes (any fare, connections included).
  - code: DEL
    name: Delhi
    priority: true
    direct_only: true
    alerts: false
  - code: BOM
    name: Mumbai
    priority: true
    alerts: false

# Per-departure-month prices, recorded alongside the daily cheapest-any-date
# check. `/v1/prices/monthly` returns every month Travelpayouts has cached for
# a route in a single request, so all available months are recorded for every
# route -- one extra API call each -- and the history page does the filtering
# by month or season. Nothing needs choosing here.
monthly_prices:
  enabled: true
  # Pause between API calls, in seconds, to stay a polite client.
  request_delay_seconds: 0.25

deal_rules:
  # A fare at or below this always alerts, whatever its history. This is the
  # single biggest driver of how often you get mail: Paris and Lisbon normally
  # sit just under $600, so this fires on ordinary days for them. Replaying the
  # real history, dropping it to $550 takes alerts from 7 days in 13 down to 2.
  floor_price_cad: 600
  # Otherwise alert only when the fare lands in the cheapest N% of that
  # route's own recorded history -- the same percentile the history page
  # shows, so the email and the page never disagree.
  alert_percentile: 5
  min_history_points: 10
  rolling_window_days: 90
  # Don't re-alert a route within this many days unless it got cheaper still.
  # Without this the statistical rule mailed 2-6 routes every single day.
  repeat_suppression_days: 7

# Warn by email when a run looks wrong -- fewer routes than configured came
# back, or a day was missed entirely -- so silent failures aren't invisible.
run_health:
  enabled: true

email:
  # Recipient address comes from the EMAIL_RECIPIENT secret/env var, not here,
  # so this file can be committed to a public repo without exposing it.
  subject_prefix: "[Flight Deal]"
  # Linked at the bottom of each email.
  page_url: "https://abhish05-prog.github.io/flight-tracker/history.html"
