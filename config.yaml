# Flight Price Tracker configuration

origin: YYZ
currency: cad

destinations:
  - code: LHR
    name: London
  - code: CDG
    name: Paris
  - code: FCO
    name: Rome
  - code: AMS
    name: Amsterdam
  - code: MAD
    name: Madrid
  - code: BCN
    name: Barcelona
  - code: FRA
    name: Frankfurt
  - code: MUC
    name: Munich
  - code: DUB
    name: Dublin
  - code: ZRH
    name: Zurich
  - code: VIE
    name: Vienna
  - code: LIS
    name: Lisbon
  - code: ATH
    name: Athens
  - code: CPH
    name: Copenhagen
  - code: ARN
    name: Stockholm
  - code: BER
    name: Berlin
  - code: WAW
    name: Warsaw
  - code: PRG
    name: Prague
  - code: BUD
    name: Budapest
  - code: BRU
    name: Brussels
  - code: MXP
    name: Milan
  - code: OSL
    name: Oslo
  - code: HEL
    name: Helsinki
  - code: EDI
    name: Edinburgh
  - code: KEF
    name: Reykjavik

  # Priority routes: shown in their own highlighted section on the history
  # page. No deal alerts/floor for these two -- just recorded daily and
  # color-coded (green/orange/red) on the history page based on how each
  # day's price compares to the route's own all-time average.
  #
  # Delhi is direct_only (nonstop-only, via /v1/prices/direct) since Air
  # India flies YYZ-DEL nonstop.
  #
  # Mumbai has no scheduled nonstop from YYZ, so it's tracked like the
  # European routes (any fare, connections included).
  - code: DEL
    name: Delhi
    priority: true
    direct_only: true
    alerts: false
  - code: BOM
    name: Mumbai
    priority: true
    alerts: false

deal_rules:
  floor_price_cad: 600
  statistical_discount_pct: 15
  min_history_points: 5
  rolling_window_days: 90

email:
  # Recipient address comes from the EMAIL_RECIPIENT secret/env var, not here,
  # so this file can be committed to a public repo without exposing it.
  subject_prefix: "[Flight Deal]"
