    name: London
  - code: CDG
    name: Paris
  - code: FCO
    name: Rome
  - code: AMS
    name: Amsterdam
  - code: MAD
    name: Madrid
  - code: BCN
    name: Barcelona
  - code: FRA
    name: Frankfurt
  - code: MUC
    name: Munich
  - code: DUB
    name: Dublin
  - code: ZRH
    name: Zurich
  - code: VIE
    name: Vienna
  - code: LIS
    name: Lisbon
  - code: ATH
    name: Athens
  - code: CPH
    name: Copenhagen
  - code: ARN
    name: Stockholm
  - code: BER
    name: Berlin
  - code: WAW
