  - code: KEF
    name: Reykjavik

  # Priority routes: shown in their own highlighted section on the history
  # page, each with a custom floor price since long-haul India fares run far
  # above the $600 floor used for Europe.
  #
  # Delhi is direct_only (nonstop-only, via /v1/prices/direct) since Air
  # India flies YYZ-DEL nonstop. Floor of $1700 is a starting estimate below
  # today's live nonstop sample (~$1969 CAD) — revisit once real history
  # accumulates.
  #
  # Mumbai has no scheduled nonstop from YYZ, so it's tracked like the
  # European routes (any fare, connections included). Floor of $1100 is a
  # starting estimate below today's live sample (~$1227 CAD).
  - code: DEL
    name: Delhi
    priority: true
    direct_only: true
    floor_price_cad: 1700
  - code: BOM
    name: Mumbai
    priority: true
    floor_price_cad: 1100

deal_rules:
  floor_price_cad: 600
  statistical_discount_pct: 15
  min_history_points: 5
  rolling_window_days: 90

email:
  # Recipient address comes from the EMAIL_RECIPIENT secret/env var, not here,
  # so this file can be committed to a public repo without exposing it.
  subject_prefix: "[Flight Deal]"
